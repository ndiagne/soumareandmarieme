<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Temporarily Closed</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 30%, #7f1d1d 0%, #450a0a 60%, #1f0505 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }
  .tape {
    width: 100vw;
    height: 34px;
    background: repeating-linear-gradient(-45deg, #facc15 0 26px, #111 26px 52px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: 4px;
    color: #111;
    text-transform: uppercase;
    position: fixed;
    z-index: 10;
  }
  .tape span {
    background: #facc15;
    padding: 2px 14px;
  }
  .tape.top { top: 0; }
  .tape.bottom { bottom: 0; }
  .alert {
    display: inline-block;
    background: #dc2626;
    color: #fff;
    font-weight: 900;
    letter-spacing: 6px;
    font-size: 15px;
    padding: 10px 26px;
    border-radius: 999px;
    margin-bottom: 26px;
    animation: blink 1.1s ease-in-out infinite;
    box-shadow: 0 0 26px rgba(220, 38, 38, .8);
  }
  @keyframes blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .55; transform: scale(.96); }
  }
  .face {
    font-size: 96px;
    line-height: 1;
    margin-bottom: 22px;
    animation: shake .6s ease-in-out infinite;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,.55));
  }
  @keyframes shake {
    0%, 100% { transform: rotate(-7deg); }
    50% { transform: rotate(7deg); }
  }
  h1 {
    font-size: clamp(26px, 6vw, 40px);
    font-weight: 900;
    margin-bottom: 16px;
    text-shadow: 0 3px 12px rgba(0,0,0,.6);
  }
  p {
    font-size: clamp(16px, 4.4vw, 20px);
    line-height: 1.65;
    max-width: 520px;
    color: #fecaca;
    font-weight: 500;
  }
  p .weirdo { color: #fff; font-weight: 800; }
  .fine {
    margin-top: 30px;
    font-size: 13px;
    color: #fca5a5;
    opacity: .75;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="tape top"><span>&#128679; Closed &#128679;</span></div>

  <div class="alert">&#128680; ALERT &#128680;</div>
  <div class="face">&#128545;</div>
  <h1>This page is temporarily closed.</h1>
  <p><span class="weirdo">Not open for weirdos.</span> &#128524; When you acting weird, the page stays shut. That&rsquo;s just how it is. Come back when you&rsquo;re done being weird, and <em>maybe</em> I&rsquo;ll take the wall down.</p>
  <div class="fine">management has spoken</div>

  <div class="tape bottom"><span>&#128679; Closed &#128679;</span></div>
</body>
</html>
